name: cards-coverage

# Roadmap 3.5: nightly grammar coverage over the whole Scryfall base pool. The report is uploaded as an
# artifact rather than committed, so the repository stays free of generated data.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:scryfall
      - run: pnpm cards:coverage
      - name: Summarise
        run: cat data/coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cards-coverage
          path: data/coverage/
