name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Card schema is up to date
        run: pnpm cards:schema --check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is measured too, so its history has to be here.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A shared runner is slower and noisier than the machine the 5 ms and 50 ms targets
      # in docs/02 are written for, so the budgets here are only ceilings against
      # something going badly wrong. The real gate is the comparison below.
      - name: Run the engine benchmarks
        run: pnpm bench --budget 12 --json bench-results/engine.json

      - name: Run the search benchmarks
        run: pnpm bench:search --budget 250 --json bench-results/search.json

      # The comparison is with the commit this one is measured against — the pull
      # request's base, or the previous head of main — timed on this same runner just
      # now. A baseline recorded by an earlier job came from another machine: runners
      # differ by more than the 20% the comparison allows, so that read a fast runner
      # followed by a slow one as a regression (+95% on code that had not changed).
      - name: Measure the base on this runner
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^)
          fi
          echo "measuring $BASE"
          git worktree add "$RUNNER_TEMP/bench-base" "$BASE"
          cd "$RUNNER_TEMP/bench-base"
          pnpm install --frozen-lockfile
          # No budget gate here: this run is only the yardstick.
          pnpm bench --budget 1000 --json "$GITHUB_WORKSPACE/bench-baseline/engine.json"
          pnpm bench:search --budget 10000 --json "$GITHUB_WORKSPACE/bench-baseline/search.json"

      - name: Compare with the base
        run: |
          pnpm bench:compare bench-baseline/engine.json bench-results/engine.json
          pnpm bench:compare bench-baseline/search.json bench-results/search.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmarks
          path: |
            bench-results/
            bench-baseline/

  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @mtg/smoke exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # docs/09 §7: a run made with a fixed seed, a game of it watched, a card banned and the
      # legalisation seen, against the built server on the repository's own cards.
      - name: Smoke the built server
        run: pnpm smoke

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: apps/smoke/playwright-report/

  docker:
    # The name is the one the repository ruleset requires: it builds the image, runs it,
    # and smokes it (docs/09 "CI").
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mtg-1v1-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @mtg/smoke exec playwright install --with-deps chromium

      # The image as it would be run: its own data volume, here holding the repository's own
      # cards, which the container's user must be able to write beside.
      - name: Run the image
        run: |
          node apps/smoke/prepare-data.mjs "$RUNNER_TEMP/smoke-data"
          chmod -R a+rwX "$RUNNER_TEMP/smoke-data"
          docker run -d --name mtg -p 8080:8080 \
            -e SCRYFALL_IMAGE_CACHE=off -e SIM_WORKERS=1 \
            -v "$RUNNER_TEMP/smoke-data:/data" mtg-1v1-agents:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker logs mtg
          exit 1

      - name: Smoke the image
        run: pnpm smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8080

      - name: The container's log
        if: always()
        run: docker logs mtg || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docker-smoke-report
          path: apps/smoke/playwright-report/
