name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Card schema is up to date
        run: pnpm cards:schema --check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A branch can read caches from the default branch, so this picks up whatever main
      # last recorded without any cross-workflow plumbing; the prefix takes the newest.
      - name: Restore the baseline recorded on main
        uses: actions/cache/restore@v6
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.sha }}
          restore-keys: bench-baseline-

      # A shared runner is slower and noisier than the machine the 5 ms and 50 ms targets
      # in docs/02 are written for, so the budgets here are only ceilings against
      # something going badly wrong. The real gate is the comparison with main below.
      - name: Run the engine benchmarks
        run: pnpm bench --budget 12 --json bench-results/engine.json

      - name: Run the search benchmarks
        run: pnpm bench:search --budget 250 --json bench-results/search.json

      - name: Compare with main
        run: |
          pnpm bench:compare bench-baseline/engine.json bench-results/engine.json
          pnpm bench:compare bench-baseline/search.json bench-results/search.json

      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench-results/

      - name: Keep this run as the baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p bench-baseline
          cp bench-results/engine.json bench-results/search.json bench-baseline/

      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.sha }}

  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @mtg/smoke exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # docs/09 §7: a run made with a fixed seed, a game of it watched, a card banned and the
      # legalisation seen, against the built server on the repository's own cards.
      - name: Smoke the built server
        run: pnpm smoke

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: apps/smoke/playwright-report/

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mtg-1v1-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @mtg/smoke exec playwright install --with-deps chromium

      # The image as it would be run: its own data volume, here holding the repository's own
      # cards, which the container's user must be able to write beside.
      - name: Run the image
        run: |
          node apps/smoke/prepare-data.mjs "$RUNNER_TEMP/smoke-data"
          chmod -R a+rwX "$RUNNER_TEMP/smoke-data"
          docker run -d --name mtg -p 8080:8080 \
            -e SCRYFALL_IMAGE_CACHE=off -e SIM_WORKERS=1 \
            -v "$RUNNER_TEMP/smoke-data:/data" mtg-1v1-agents:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker logs mtg
          exit 1

      - name: Smoke the image
        run: pnpm smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8080

      - name: The container's log
        if: always()
        run: docker logs mtg || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docker-smoke-report
          path: apps/smoke/playwright-report/
