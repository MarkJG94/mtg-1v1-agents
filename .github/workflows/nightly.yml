name: Nightly

on:
  schedule:
    # 04:00 UTC, which is a quiet hour for the shared runners and after Scryfall's own
    # bulk-data rebuild.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    name: Auto-scripter coverage over every card
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fetched here rather than committed: it is 37 MB of projection rebuilt daily, and a
      # repository is the wrong place for either half of that sentence.
      - name: Fetch every card from Scryfall
        run: pnpm fetch:scryfall

      - name: Measure
        run: pnpm cards:coverage --top 60

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: reports/

      # The report is the deliverable, not a gate: a parser that reads less of Magic than
      # it did yesterday is worth waking up to, and is never a reason to stop a merge.
      - name: Open or update the issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('reports/coverage.md', 'utf8');
            const title = 'Auto-scripter coverage';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'coverage',
            });
            const existing = open.find((issue) => issue.title === title);

            const footer =
              `\n\n---\n_Measured on ${new Date().toISOString().slice(0, 10)} by the ` +
              `[nightly workflow](${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId})._\n`;

            if (existing === undefined) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['coverage'],
                body: body + footer,
              });
            } else {
              // Updated in place rather than commented on: the interesting thing is what
              // the parser cannot read *now*, and a hundred nightly comments would bury it.
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body + footer,
              });
            }

  fuzz:
    name: Long fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # docs/09 asks the nightly for a 30-minute run against CI's short one. The fuzzer
      # reads its budget from the environment so the same test serves both.
      - name: Fuzz
        run: pnpm test packages/engine/src/testing/fuzz.test.ts
        env:
          FUZZ_GAMES: "20000"
