    setup: { A: { hand: ['~'], battlefield: [Swamp, Swamp] }, B: { battlefield: [Hill Giant] } }
    actions: [{ cast: '~', target: Hill Giant }, resolveAll]
    expect: { B.graveyard: [Hill Giant] }
