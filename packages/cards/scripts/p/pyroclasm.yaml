# Pyroclasm
#
# Sentences to claim with `covers:`, numbered as the validator numbers them:
#   0. Pyroclasm deals 2 damage to each creature.

oracleId: e4bcd4ea-e7cd-4471-8f3b-18bb51d3d70c
name: "Pyroclasm"
manaCost: "{1}{R}"
types: [sorcery]
colours: [R]
text: "Pyroclasm deals 2 damage to each creature."

abilities:
  - kind: spell
    covers: [0]
    effects:
      - op: forEach
        of: creature
        effects: [{ op: damage, to: $each, amount: 2 }]

tests:
  - name: deals two to each creature, killing the small ones
    setup:
      you:
        creatures: [{ name: small, power: 1, toughness: 1 }]
      opponent:
        creatures: [{ name: big, power: 4, toughness: 4 }]
    expect:
      zone: { small: "A:graveyard", big: battlefield }
