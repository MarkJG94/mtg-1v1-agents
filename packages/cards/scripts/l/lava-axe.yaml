# Lava Axe
#
# Sentences to claim with `covers:`, numbered as the validator numbers them:
#   0. Lava Axe deals 5 damage to target player or planeswalker.

oracleId: 387b6b07-a283-412d-94c3-f7f1dc76e858
name: "Lava Axe"
manaCost: "{4}{R}"
types: [sorcery]
colours: [R]
text: "Lava Axe deals 5 damage to target player or planeswalker."

abilities:
  - kind: spell
    covers: [0]
    targets: [{ id: t, filter: { or: [player, planeswalker] } }]
    effects: [{ op: damage, to: $t, amount: 5 }]

tests:
  - name: deals five to a player
    targets: [opponent]
    expect:
      life: { opponent: 15 }
